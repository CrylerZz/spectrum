<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Orbital rendering harness</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      import { Renderer } from '/src/visuals/Renderer.js'
      import { defaults } from '/src/visuals/scenes.js'
      const settings = { ...defaults, quality: 'high' }
      const renderer = new Renderer(document.querySelector('canvas'), settings)
      const spectrum = new Uint8Array(64).fill(240)
      const audio = { bass: 240 / 255, mid: 240 / 255, high: 240 / 255, beat: 0 }
      window.orbitalTest = {
        renderer,
        settings,
        spectrum,
        audio,
        frame(dt = 1 / 60) {
          renderer.render(dt, audio, spectrum)
        },
      }
    </script>
  </body>
</html>
